<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siggy Soul - Ritual Testnet Collection</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --dark-bg: #030a05;
            --card-bg: rgba(0, 15, 5, 0.6);
            --glow-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
            --text-glow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 50, 20, 0.4) 0%, transparent 50%),
                linear-gradient(rgba(0, 0, 0, 0.95), rgba(3, 10, 5, 0.98));
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* Navbar */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .logo {
            color: var(--neon-green);
            font-weight: bold;
            letter-spacing: 6px;
            font-size: 1.2rem;
            text-shadow: var(--text-glow);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .audio-toggle {
            background: none;
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: var(--neon-green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-toggle:hover {
            box-shadow: var(--glow-shadow);
            border-color: var(--neon-green);
        }

        .connect-btn {
            background-color: var(--neon-green);
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--glow-shadow);
            transition: all 0.3s ease;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.8);
        }

        /* Hero / Title Section */
        .hero-section {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .subtitle {
            color: rgba(0, 255, 102, 0.6);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .main-title {
            color: var(--neon-green);
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
            margin-bottom: 30px;
        }

        /* NFT Container Layout */
        .nft-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 70px;
            padding: 0 20px;
        }

        .top-row {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .bottom-row {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 80px;
            flex-wrap: wrap;
        }

        /* Card Styling - Modified to allow candle positioning */
        .nft-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 102, 0.25);
            padding: 20px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--glow-shadow), inset 0 0 20px rgba(0, 255, 102, 0.15);
            position: relative;
            max-width: 380px;
            width: 100%;
            transition: transform 0.3s ease;
            overflow: visible; /* تعديل: للسماح للشموع بالخروج عن حواف الكرت */
            margin: 0 20px;
        }

        .nft-card:hover {
            transform: scale(1.02);
        }

        /* تعديل الشموع: أكبر وموضعة في الحافة السفلية */
        .candle {
            position: absolute;
            bottom: 0; /* تم التعديل: تثبيت على الحافة السفلية */
            width: 12px; /* تم التعديل: تكبير العرض */
            height: 60px; /* تم التعديل: تكبير الطول */
            background: linear-gradient(to top, #e0e0e0, #ffffff);
            border-radius: 4px 4px 0 0;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .candle.left { left: -12px; } /* تم التعديل: ترحيل للخارج */
        .candle.right { right: -12px; }

        /* لهب الشمعة */
        .candle::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 20px;
            background: var(--neon-green);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 15px var(--neon-green), 0 0 25px var(--neon-green);
            animation: flicker 1.2s infinite ease-in-out alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) rotate(-2deg); opacity: 0.9; }
            100% { transform: translateX(-50%) rotate(2deg); opacity: 1; }
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border: 1px solid rgba(0, 255, 102, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neon-green);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            border: 2px dashed rgba(0, 255, 102, 0.2);
        }

        .nft-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nft-name {
            margin-top: 25px;
            margin-bottom: 15px;
            color: var(--neon-green);
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: var(--text-glow);
            text-align: center;
        }

        .mint-btn {
            background-color: var(--neon-green);
            color: #000000;
            border: none;
            width: 65%;
            padding: 12px 0;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: var(--glow-shadow);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .mint-btn:hover {
            box-shadow: 0 0 25px var(--neon-green);
            letter-spacing: 6px;
        }

        .quote-container {
            margin-top: 60px;
            margin-bottom: 50px;
            text-align: center;
            font-style: italic;
            color: rgba(0, 255, 102, 0.6);
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        footer {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .main-title { font-size: 2.5rem; }
            .bottom-row { gap: 40px; }
            .candle { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">♦ R I T U A L</div>
        <div class="nav-right">
            <button class="audio-toggle" title="Toggle Music">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <button class="connect-btn">Connect Wallet</button>
        </div>
    </header>

    <div class="hero-section">
        <p class="subtitle">- RITUAL TESTNET COLLECTION -</p>
        <h1 class="main-title">SIGGY SOUL</h1>
    </div>

    <div class="nft-container">
        <div class="top-row">
            <div class="nft-card">
                <div class="candle left"></div>
                <div class="candle right"></div>
                <div class="image-container">
                    <img src="born_in_the_dark.jpg" alt="Born in the Dark" class="nft-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="image-placeholder" style="display:none;">
                        <span>SIGGY SOUL</span>
                        <small style="font-size:10px; margin-top:10px;">[ BORN IN THE DARK ]</small>
                    </div>
                </div>
                <div class="nft-name">BORN IN THE DARK</div>
                <button class="mint-btn">MINT</button>
            </div>
        </div>

        <div class="bottom-row">
            <div class="nft-card">
                <div class="candle left"></div>
                <div class="candle right"></div>
                <div class="image-container">
                    <img src="the_green_miasma.jpg" alt="The Green Miasma" class="nft-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="image-placeholder" style="display:none;">
                        <span>SIGGY SOUL</span>
                        <small style="font-size:10px; margin-top:10px;">[ THE GREEN MIASMA ]</small>
                    </div>
                </div>
                <div class="nft-name">THE GREEN MIASMA</div>
                <button class="mint-btn">MINT</button>
            </div>

            <div class="nft-card">
                <div class="candle left"></div>
                <div class="candle right"></div>
                <div class="image-container">
                    <img src="shadow_of_siggy.jpg" alt="Shadow of Siggy" class="nft-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="image-placeholder" style="display:none;">
                        <span>SIGGY SOUL</span>
                        <small style="font-size:10px; margin-top:10px;">[ SHADOW OF SIGGY ]</small>
                    </div>
                </div>
                <div class="nft-name">SHADOW OF SIGGY</div>
                <button class="mint-btn">MINT</button>
            </div>
        </div>
    </div>

    <div class="quote-container">
        <p>"EVREY SOUL MUST JOIN THE RITUAL."</p>
    </div>

    <footer>
        * MADE BY LiTEino *
    </footer>

    <script>
        document.querySelectorAll('.mint-btn, .connect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                alert('Connecting to Ritual Testnet...');
            });
        });
    </script>
</body>
</html>
